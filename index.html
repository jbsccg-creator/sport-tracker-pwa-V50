<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Suivi Sportif">
  <meta name="theme-color" content="#111827" />
  <title>JB Sport Tracker</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <button id="backBtn" class="back-btn hidden" type="button" aria-label="Retour"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg></button>
    <div>
      <p class="eyebrow" id="viewTitle">Programme annuel</p>
      <h1>JB Sport Tracker</h1>
    </div>
    <button id="installBtn" class="ghost hidden" type="button">Installer</button>
  </header>

  <nav class="bottomnav" aria-label="Navigation principale">
    <button type="button" data-view="today" class="active"><span class="ico" aria-hidden="true">🏠</span>Aujourd'hui</button>
    <button type="button" data-view="planning"><span class="ico" aria-hidden="true">📅</span>Planning</button>
    <button type="button" data-view="session"><span class="ico" aria-hidden="true">💪</span>Séance</button>
    <button type="button" data-view="charts"><span class="ico" aria-hidden="true">📊</span>Stats</button>
    <button type="button" id="moreBtn"><span class="ico" aria-hidden="true">⋯</span>Plus</button>
  </nav>

  <div id="moreSheet" class="more-sheet hidden" role="dialog" aria-label="Plus">
    <div class="sheet-inner">
      <p class="eyebrow">Plus</p>
      <button type="button" data-view="goals"><span aria-hidden="true">🎯</span> Objectifs</button>
      <button type="button" data-view="gear"><span aria-hidden="true">🧰</span> Matériel</button>
      <button type="button" id="myTemplatesBtn"><span aria-hidden="true">📋</span> Mes séances</button>
      <button type="button" id="libraryBtn"><span aria-hidden="true">📚</span> Exercices</button>
      <button type="button" id="trophiesBtn"><span aria-hidden="true">🏆</span> Trophées</button>
      <button type="button" data-view="routine"><span aria-hidden="true">🧘</span> Routine</button>
      <button type="button" data-view="history"><span aria-hidden="true">🗂️</span> Historique</button>
      <button type="button" data-view="settings"><span aria-hidden="true">⚙️</span> Réglages</button>
      <button type="button" id="moreClose" class="ghost">Fermer</button>
    </div>
  </div>

  <main>
    <section id="today" class="view active"></section>
    <section id="planning" class="view"></section>
    <section id="session" class="view"></section>
    <section id="charts" class="view"></section>
    <section id="routine" class="view"></section>
    <section id="history" class="view"></section>
    <section id="goals" class="view"></section>
    <section id="gear" class="view"></section>
    <section id="settings" class="view"></section>
  </main>

  <section id="timer" class="timer hidden" role="status" aria-live="polite">
    <div>
      <span class="eyebrow">Repos en cours</span>
      <strong id="timerTime">00:00</strong>
      <span id="timerLabel" class="muted">Repos</span>
    </div>
    <div class="timer-actions">
      <button type="button" id="pauseTimer">Pause</button>
      <button type="button" id="skipTimer">Passer</button>
    </div>
  </section>

  <script src="vendor/supabase.js"></script>
  <script src="supabase-config.js"></script>
  <script src="programme.js"></script>
  <script src="quotes.js"></script>
  <script src="exercises-db.js"></script>
  <script src="app.js"></script>
</body>
</html>
